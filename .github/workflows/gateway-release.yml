name: Build and sign Gateway Debian release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gateway-release.yml"
      - "solarminer-gateway-code02-v0.6.9-candidate/**"
      - "the-solar-miner-pwa-v0.5.7-candidate/**"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create, e.g. gateway-v0.6.16"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: solarminer-gateway-release
  cancel-in-progress: false

jobs:
  build-test-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate requested release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          if [ -z "$RELEASE_TAG" ]; then
            PACKAGE_VERSION="$(sed -n 's/^Version: //p' solarminer-gateway-code02-v0.6.9-candidate/packaging/control)"
            RELEASE_TAG="gateway-v$PACKAGE_VERSION"
          fi
          case "$RELEASE_TAG" in
            gateway-v*) ;;
            *) echo "Release tag must begin with gateway-v" >&2; exit 1 ;;
          esac
          VERSION="${RELEASE_TAG#gateway-v}"
          case "$VERSION" in
            *[!0-9A-Za-z.+:~_-]*|'') echo "Invalid version in release tag" >&2; exit 1 ;;
          esac
          PACKAGE_VERSION="$(sed -n 's/^Version: //p' solarminer-gateway-code02-v0.6.9-candidate/packaging/control)"
          [ "$VERSION" = "$PACKAGE_VERSION" ] || { echo "Tag version $VERSION does not match package version $PACKAGE_VERSION" >&2; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3-pytest python3-fastapi python3-uvicorn python3-argon2 python3-cryptography python3-qrcode python3-httpx python3-pip openssl adduser zip
          python3 -m pip install --break-system-packages 'pydantic==2.10.6' 'fastapi==0.115.11'

      - name: Check USB installer shell syntax
        working-directory: solarminer-gateway-code02-v0.6.9-candidate
        run: |
          sh -n packaging/install-from-usb.sh
          sh -n packaging/repair-existing-from-usb.sh
          sh -n packaging/postinst
          sh -n packaging/prerm
          sh -n packaging/solarminer-public-tls-renew
          sh -n packaging/install-tailscale.sh
          sh -n packaging/solarminer-update-broker
          sh -n packaging/solarminer-tailscale-info
          sh -n packaging/solarminer-tailscale-connect
          sh -n packaging/solarminer-tailscale-cert
          [ "$(sed -n 's/^TARGET_VERSION=//p' packaging/repair-existing-from-usb.sh)" = "$(sed -n 's/^Version: //p' packaging/control)" ]
          ! grep -q '^VERSION=' packaging/repair-existing-from-usb.sh
          VERIFY_ROOT="$(mktemp -d)"
          mkdir -p "$VERIFY_ROOT/etc" "$VERIFY_ROOT/usr/lib/systemd/system" "$VERIFY_ROOT/usr/bin"
          printf 'root:x:0:0:root:/root:/bin/sh\nsolarminer:x:998:998:SolarMiner:/var/lib/solarminer:/usr/sbin/nologin\n' > "$VERIFY_ROOT/etc/passwd"
          printf 'root:x:0:\nsolarminer:x:998:\n' > "$VERIFY_ROOT/etc/group"
          install -m 0644 packaging/solarminer-recovery.service "$VERIFY_ROOT/usr/lib/systemd/system/solarminer-recovery.service"
          install -m 0644 packaging/solarminer-error-report.service "$VERIFY_ROOT/usr/lib/systemd/system/solarminer-error-report.service"
          install -m 0644 packaging/solarminer-error-report.timer "$VERIFY_ROOT/usr/lib/systemd/system/solarminer-error-report.timer"
          install -m 0644 packaging/solarminer-update-broker@.service "$VERIFY_ROOT/usr/lib/systemd/system/solarminer-update-broker@.service"
          install -m 0644 packaging/solarminer-update-broker.socket "$VERIFY_ROOT/usr/lib/systemd/system/solarminer-update-broker.socket"
          install -m 0755 packaging/solarminer-recovery "$VERIFY_ROOT/usr/bin/solarminer-recovery"
          install -m 0755 packaging/solarminer-update-broker "$VERIFY_ROOT/usr/bin/solarminer-update-broker"
          install -m 0755 /usr/bin/true "$VERIFY_ROOT/usr/bin/true"
          install -m 0755 /usr/bin/true "$VERIFY_ROOT/usr/bin/python3"
          for TARGET in sysinit local-fs sockets network-online; do
            printf '[Unit]\nDescription=Verification placeholder target\n' > "$VERIFY_ROOT/usr/lib/systemd/system/$TARGET.target"
          done
          printf '[Unit]\nDescription=Verification placeholder Gateway service\n[Service]\nExecStart=/usr/bin/true\n' > "$VERIFY_ROOT/usr/lib/systemd/system/solarminer-gateway.service"
          systemd-analyze --root="$VERIFY_ROOT" verify solarminer-recovery.service solarminer-error-report.service solarminer-error-report.timer solarminer-update-broker.socket solarminer-update-broker@.service

      - name: Run Gateway tests
        working-directory: solarminer-gateway-code02-v0.6.9-candidate
        run: make test

      - name: Check packaged PWA syntax
        working-directory: solarminer-gateway-code02-v0.6.9-candidate/web/pwa
        run: |
          node --check app.js
          node --check gateway-auth.js

      - name: Run PWA candidate tests
        working-directory: the-solar-miner-pwa-v0.5.7-candidate
        run: npm test

      - name: Build Debian package
        working-directory: solarminer-gateway-code02-v0.6.9-candidate
        run: make deb

      - name: Create and sign release manifest
        id: manifest
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          MIN_COMPATIBLE_VERSION: "0.6.9"
          SIGNING_KEY: ${{ secrets.SOLARMINER_RELEASE_SIGNING_KEY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          test -n "$SIGNING_KEY" || { echo "Missing SOLARMINER_RELEASE_SIGNING_KEY Actions secret" >&2; exit 1; }
          PACKAGE="solarminer-gateway-code02-v0.6.9-candidate/dist/solarminer-gateway_${RELEASE_VERSION}_amd64.deb"
          test -s "$PACKAGE"
          python3 - "$PACKAGE" <<'PY'
          import base64, hashlib, json, os, re, sys
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          def load_signing_key(secret):
              # GitHub secrets are sometimes pasted as escaped PEM, OpenSSH, or
              # base64/hex raw Ed25519 seed. Normalize without ever logging it.
              text = secret.strip().replace("\\r\\n", "\\n").replace("\\n", "\n")
              if len(text) >= 2 and text[0] == text[-1] and text[0] in "\\\"'":
                  text = text[1:-1].strip()
              data = text.encode("utf-8")
              candidates = [data]
              try:
                  decoded = base64.b64decode(text, validate=True)
                  if decoded and decoded != data:
                      candidates.append(decoded)
              except (ValueError, base64.binascii.Error):
                  pass
              if re.fullmatch(r"[0-9a-fA-F]{64}", text):
                  candidates.append(bytes.fromhex(text))
              for candidate in candidates:
                  for loader in (serialization.load_pem_private_key,
                                 serialization.load_ssh_private_key,
                                 serialization.load_der_private_key):
                      try:
                          key = loader(candidate, password=None)
                          if isinstance(key, Ed25519PrivateKey):
                              return key
                      except (ValueError, TypeError):
                          continue
                  if len(candidate) == 32:
                      try:
                          return Ed25519PrivateKey.from_private_bytes(candidate)
                      except ValueError:
                          pass
              raise SystemExit(
                  "SOLARMINER_RELEASE_SIGNING_KEY is not a supported Ed25519 private key. "
                  "Store the complete unencrypted PEM/OpenSSH private key, or a base64/hex "
                  "32-byte Ed25519 seed. Never store the public key in this secret."
              )

          package = Path(sys.argv[1])
          key = load_signing_key(os.environ["SIGNING_KEY"])
          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPOSITORY"]
          package_name = package.name
          url = f"https://github.com/{repo}/releases/download/{tag}/{package_name}"
          unsigned = {
              "schema_version": 1,
              "release_id": tag,
              "version": version,
              "min_compatible_version": os.environ["MIN_COMPATIBLE_VERSION"],
              "changelog": [f"SolarMiner Gateway CODE02 {version}"],
              "package_name": package_name,
              "package_url": url,
              "package_size": package.stat().st_size,
              "sha256": hashlib.sha256(package.read_bytes()).hexdigest(),
              "signature_algorithm": "Ed25519",
              "compatibility": {
                  "architecture": "amd64",
                  "debian_min": "13",
                  "python_min": "3.13"
              },
              "migration_requirements": []
          }
          canonical = json.dumps(unsigned, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          manifest = dict(unsigned)
          manifest["signature"] = key.sign(canonical).hex()
          output = package.parent / "solarminer-release.json"
          output.write_text(json.dumps(manifest, sort_keys=True, separators=(",", ":"), ensure_ascii=False) + "\n", encoding="utf-8")
          public_key = key.public_key()
          public_output = package.parent / "release-pubkey.pem"
          public_output.write_bytes(public_key.public_bytes(
              serialization.Encoding.PEM, serialization.PublicFormat.SubjectPublicKeyInfo
          ))
          public_output.chmod(0o644)
          fingerprint = hashlib.sha256(public_key.public_bytes(
              serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo
          )).hexdigest()
          print(f"Manifest created for {package_name}; SHA-256 {unsigned['sha256']}; {unsigned['package_size']} bytes")
          print(f"Public release-key SHA-256 fingerprint: {fingerprint}")
          PY
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "manifest=${PACKAGE%/*}/solarminer-release.json" >> "$GITHUB_OUTPUT"
          echo "public_key=${PACKAGE%/*}/release-pubkey.pem" >> "$GITHUB_OUTPUT"

      - name: Download and verify rollback packages for supported installed versions
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLIC_KEY: ${{ steps.manifest.outputs.public_key }}
        run: |
          set -eu
          ROLLBACK_ROOT="$RUNNER_TEMP/solarminer-usb-rollback"
          mkdir -p "$ROLLBACK_ROOT"
          for VERSION in 0.6.10 0.6.11 0.6.12 0.6.13 0.6.14 0.6.20 0.6.29 0.6.30 0.6.31 0.6.32 0.6.33 0.6.39; do
            DEST="$ROLLBACK_ROOT/$VERSION"
            mkdir -p "$DEST"
            gh release download "gateway-v$VERSION" \
              --pattern "solarminer-gateway_${VERSION}_amd64.deb" \
              --pattern solarminer-release.json \
              --dir "$DEST" --repo "$GITHUB_REPOSITORY"
            python3 - "$VERSION" "$DEST" "$PUBLIC_KEY" <<'PY'
          import hashlib, json, pathlib, sys
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          version, directory, key_path = sys.argv[1:]
          directory = pathlib.Path(directory)
          package = directory / f"solarminer-gateway_{version}_amd64.deb"
          manifest = json.loads((directory / "solarminer-release.json").read_text(encoding="utf-8"))
          key = serialization.load_pem_public_key(pathlib.Path(key_path).read_bytes())
          if not isinstance(key, Ed25519PublicKey):
              raise SystemExit("release key is not Ed25519")
          if manifest.get("version") != version or manifest.get("release_id") != f"gateway-v{version}":
              raise SystemExit(f"rollback manifest identity mismatch for {version}")
          if manifest.get("package_name") != package.name or manifest.get("package_url") != f"https://github.com/{__import__('os').environ['GITHUB_REPOSITORY']}/releases/download/gateway-v{version}/{package.name}":
              raise SystemExit(f"rollback package URL mismatch for {version}")
          if type(manifest.get("package_size")) is not int or manifest["package_size"] != package.stat().st_size:
              raise SystemExit(f"rollback package size mismatch for {version}")
          if hashlib.sha256(package.read_bytes()).hexdigest() != manifest.get("sha256"):
              raise SystemExit(f"rollback package hash mismatch for {version}")
          unsigned = {name: value for name, value in manifest.items() if name != "signature"}
          signature = bytes.fromhex(manifest["signature"])
          key.verify(signature, json.dumps(unsigned, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8"))
          PY
          done

      - name: Assemble verified USB installer
        id: usb
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PACKAGE: ${{ steps.manifest.outputs.package }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
          PUBLIC_KEY: ${{ steps.manifest.outputs.public_key }}
        run: |
          set -eu
          BUNDLE="$RUNNER_TEMP/solarminer-usb-installer"
          mkdir -p "$BUNDLE"
          cp "$PACKAGE" "$MANIFEST" "$PUBLIC_KEY" "$BUNDLE/"
          for VERSION in 0.6.10 0.6.11 0.6.12 0.6.13 0.6.14 0.6.20 0.6.29 0.6.30 0.6.31 0.6.32 0.6.33 0.6.39; do
            cp "$RUNNER_TEMP/solarminer-usb-rollback/$VERSION/solarminer-gateway_${VERSION}_amd64.deb" "$BUNDLE/"
            cp "$RUNNER_TEMP/solarminer-usb-rollback/$VERSION/solarminer-release.json" "$BUNDLE/solarminer-release-$VERSION.json"
          done
          cp solarminer-gateway-code02-v0.6.9-candidate/packaging/install-from-usb.sh "$BUNDLE/"
          cp solarminer-gateway-code02-v0.6.9-candidate/packaging/install-tailscale.sh "$BUNDLE/"
          cp solarminer-gateway-code02-v0.6.9-candidate/packaging/repair-existing-from-usb.sh "$BUNDLE/"
          cp solarminer-gateway-code02-v0.6.9-candidate/packaging/USB_INSTALL_README.txt "$BUNDLE/README.txt"
          cp solarminer-gateway-code02-v0.6.9-candidate/packaging/USB_REPAIR_README.txt "$BUNDLE/REPAIR_EXISTING_README.txt"
          OUTPUT="$GITHUB_WORKSPACE/solarminer-gateway-code02-v0.6.9-candidate/dist/solarminer-gateway-usb-installer_${RELEASE_VERSION}_amd64.zip"
          (cd "$BUNDLE" && zip -q -r "$OUTPUT" .)
          echo "bundle=$OUTPUT" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PACKAGE: ${{ steps.manifest.outputs.package }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
          USB_BUNDLE: ${{ steps.usb.outputs.bundle }}
        run: |
          set -eu
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
            [ "$IS_DRAFT" = "true" ] || { echo "Refusing to replace assets of a published release" >&2; exit 1; }
            gh release upload "$RELEASE_TAG" "$PACKAGE" "$MANIFEST" "$USB_BUNDLE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "$PACKAGE" "$MANIFEST" "$USB_BUNDLE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "SolarMiner Gateway ${RELEASE_VERSION}" \
              --notes "Signed amd64 Debian package, Ed25519 release manifest and verified first-install USB bundle. Published automatically after the required build, tests, package validation and signing steps pass."
          fi
