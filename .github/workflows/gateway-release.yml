name: Build and sign Gateway Debian release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create, e.g. gateway-v0.6.9"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: solarminer-gateway-release
  cancel-in-progress: false

jobs:
  build-test-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Validate requested release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -eu
          case "$RELEASE_TAG" in
            gateway-v*) ;;
            *) echo "Release tag must begin with gateway-v" >&2; exit 1 ;;
          esac
          VERSION="${RELEASE_TAG#gateway-v}"
          case "$VERSION" in
            *[!0-9A-Za-z.+:~_-]*|'') echo "Invalid version in release tag" >&2; exit 1 ;;
          esac
          PACKAGE_VERSION="$(sed -n 's/^Version: //p' solarminer-gateway-code02-v0.6.9-candidate/packaging/control)"
          [ "$VERSION" = "$PACKAGE_VERSION" ] || { echo "Tag version $VERSION does not match package version $PACKAGE_VERSION" >&2; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3-pytest python3-fastapi python3-uvicorn python3-argon2 python3-cryptography python3-qrcode python3-httpx python3-pip openssl adduser
          python3 -m pip install --break-system-packages 'pydantic==2.10.6' 'fastapi==0.115.11'

      - name: Run Gateway tests
        working-directory: solarminer-gateway-code02-v0.6.9-candidate
        run: make test

      - name: Check packaged PWA syntax
        working-directory: solarminer-gateway-code02-v0.6.9-candidate/web/pwa
        run: |
          node --check app.js
          node --check gateway-auth.js

      - name: Run PWA candidate tests
        working-directory: the-solar-miner-pwa-v0.5.7-candidate
        run: npm test

      - name: Build Debian package
        working-directory: solarminer-gateway-code02-v0.6.9-candidate
        run: make deb

      - name: Create and sign release manifest
        id: manifest
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SIGNING_KEY: ${{ secrets.SOLARMINER_RELEASE_SIGNING_KEY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -eu
          test -n "$SIGNING_KEY" || { echo "Missing SOLARMINER_RELEASE_SIGNING_KEY Actions secret" >&2; exit 1; }
          PACKAGE="solarminer-gateway-code02-v0.6.9-candidate/dist/solarminer-gateway_${RELEASE_VERSION}_amd64.deb"
          test -s "$PACKAGE"
          python3 - "$PACKAGE" <<'PY'
          import base64, hashlib, json, os, re, sys
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey

          def load_signing_key(secret):
              # GitHub secrets are sometimes pasted as escaped PEM, OpenSSH, or
              # base64/hex raw Ed25519 seed. Normalize without ever logging it.
              text = secret.strip().replace("\\r\\n", "\\n").replace("\\n", "\n")
              if len(text) >= 2 and text[0] == text[-1] and text[0] in "\\\"'":
                  text = text[1:-1].strip()
              data = text.encode("utf-8")
              candidates = [data]
              try:
                  decoded = base64.b64decode(text, validate=True)
                  if decoded and decoded != data:
                      candidates.append(decoded)
              except (ValueError, base64.binascii.Error):
                  pass
              if re.fullmatch(r"[0-9a-fA-F]{64}", text):
                  candidates.append(bytes.fromhex(text))
              for candidate in candidates:
                  for loader in (serialization.load_pem_private_key,
                                 serialization.load_ssh_private_key,
                                 serialization.load_der_private_key):
                      try:
                          key = loader(candidate, password=None)
                          if isinstance(key, Ed25519PrivateKey):
                              return key
                      except (ValueError, TypeError):
                          continue
                  if len(candidate) == 32:
                      try:
                          return Ed25519PrivateKey.from_private_bytes(candidate)
                      except ValueError:
                          pass
              raise SystemExit(
                  "SOLARMINER_RELEASE_SIGNING_KEY is not a supported Ed25519 private key. "
                  "Store the complete unencrypted PEM/OpenSSH private key, or a base64/hex "
                  "32-byte Ed25519 seed. Never store the public key in this secret."
              )

          package = Path(sys.argv[1])
          key = load_signing_key(os.environ["SIGNING_KEY"])
          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPOSITORY"]
          package_name = package.name
          url = f"https://github.com/{repo}/releases/download/{tag}/{package_name}"
          unsigned = {
              "schema_version": 1,
              "release_id": tag,
              "version": version,
              "min_compatible_version": version,
              "changelog": [f"SolarMiner Gateway CODE02 {version}"],
              "package_name": package_name,
              "package_url": url,
              "package_size": package.stat().st_size,
              "sha256": hashlib.sha256(package.read_bytes()).hexdigest(),
              "signature_algorithm": "Ed25519",
              "compatibility": {
                  "architecture": "amd64",
                  "debian_min": "13",
                  "python_min": "3.13"
              },
              "migration_requirements": []
          }
          canonical = json.dumps(unsigned, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
          manifest = dict(unsigned)
          manifest["signature"] = key.sign(canonical).hex()
          output = package.parent / "solarminer-release.json"
          output.write_text(json.dumps(manifest, sort_keys=True, separators=(",", ":"), ensure_ascii=False) + "\n", encoding="utf-8")
          print(f"Manifest created for {package_name}; SHA-256 {unsigned['sha256']}; {unsigned['package_size']} bytes")
          PY
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "manifest=${PACKAGE%/*}/solarminer-release.json" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PACKAGE: ${{ steps.manifest.outputs.package }}
          MANIFEST: ${{ steps.manifest.outputs.manifest }}
        run: |
          set -eu
          gh release create "$RELEASE_TAG" "$PACKAGE" "$MANIFEST"             --repo "$GITHUB_REPOSITORY"             --target "$GITHUB_SHA"             --draft             --title "SolarMiner Gateway ${RELEASE_VERSION}"             --notes "Signed amd64 Debian package and Ed25519 release manifest. Review workflow results and publish this draft when ready."
