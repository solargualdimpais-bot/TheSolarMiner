limit_req_zone $binary_remote_addr zone=solarminer_auth:10m rate=10r/m;
log_format solarminer_intelligence escape=json
    '{"time":"$time_iso8601","diagnostic_id":"$arg_diagnostic_id","method":"$request_method","uri":"$uri","status":$status,"request_time":"$request_time","upstream_status":"$upstream_status","upstream_time":"$upstream_response_time"}';
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/webroot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/solarminer/public-tls.crt;
    ssl_certificate_key /etc/solarminer/public-tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SolarMinerTLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 3m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;

    location = /api/v1/auth/login {
        limit_req zone=solarminer_auth burst=5 nodelay;
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_trusted_certificate /var/lib/solarminer/server.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/v1/auth/password-device-login {
        limit_req zone=solarminer_auth burst=5 nodelay;
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_trusted_certificate /var/lib/solarminer/server.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/v1/integrations/deye-cloud/history/import {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_ssl_trusted_certificate /var/lib/solarminer/server.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/v1/system/terminal/ws {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_ssl_trusted_certificate /var/lib/solarminer/server.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # A local 9B model can take several minutes on CPU. Keep Nginx above the
    # agent (300s), Gateway (305s) and PWA (320s) deadlines.
    location = /api/v1/intelligence/ask {
        access_log /var/log/nginx/solarminer-intelligence-access.log solarminer_intelligence;
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_read_timeout 315s;
        proxy_send_timeout 315s;
        proxy_ssl_trusted_certificate /var/lib/solarminer/server.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/v1/intelligence/workspace-tests {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_read_timeout 650s;
        proxy_send_timeout 650s;
        proxy_ssl_trusted_certificate /var/lib/solarminer/server.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_ssl_trusted_certificate /var/lib/solarminer/server.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
