limit_req_zone $binary_remote_addr zone=solarminer_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/webroot;
        default_type text/plain;
        try_files $uri =404;
        access_log off;
    }
    location / { return 404; }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/solarminer/public-tls.crt;
    ssl_certificate_key /etc/solarminer/public-tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SolarMinerTLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 3m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;

    location = /api/v1/auth/login {
        limit_req zone=solarminer_auth burst=5 nodelay;
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_trusted_certificate /var/lib/solarminer/server.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/v1/auth/password-device-login {
        limit_req zone=solarminer_auth burst=5 nodelay;
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_trusted_certificate /var/lib/solarminer/server.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_trusted_certificate /var/lib/solarminer/server.crt;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_name localhost;
        proxy_ssl_server_name on;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
